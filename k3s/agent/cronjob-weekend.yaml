# Hourly weekend cadence: 3pm Saturday through 8pm Sunday, America/New_York
# (SB-1056). The window crosses midnight, so it takes two CronJobs — a single
# cron expression cannot say "Sat 15:00 to Sun 20:00".
#
# The base CronJob (cronjob.yaml, 0 2,8,14,20) covers five hours inside this
# window — 20:00 Sat and 02:00/08:00/14:00/20:00 Sun — and
# concurrencyPolicy: Forbid does not span CronJobs. Those hours are excluded
# below, so two agents never scrape the same targets at the same moment and
# double-publish to the matches-fanout exchange.
#
# Those are ET hours because the base CronJob is on America/New_York too. It
# was implicit until SB-1060: a schedule with no timeZone is interpreted in the
# kube-controller-manager's local zone, which here is America/New_York, so
# `0 2,8,14,20` had always fired at ET hours and never at UTC ones. SB-1056
# excluded 22/04/10/16 on the assumption it was UTC, which both collided with
# base five times and left four holes. Do not reintroduce a UTC assumption.
#
# Both CronJobs now name the same zone, so they track DST together and these
# exclusions stay aligned across the November change.
#
# Replaces the "0 5,11,17,23 * * 0,6" schedule that was committed in #70 and
# never applied to the cluster.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: match-scraper-agent-weekend-sat
  namespace: match-scraper
spec:
  # Sat 15:00-23:00 ET hourly, minus 20:00 which the base CronJob covers.
  schedule: "0 15-19,21-23 * * 6"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: agent
              image: ghcr.io/silverbeer/match-scraper:latest
              imagePullPolicy: Always
              args: ["run", "--env", "prod"]
              env:
                - name: ASSIST_FEED_CACHE_DIR
                  value: /data/agent-state/assist-feeds
              envFrom:
                - configMapRef:
                    name: match-scraper-agent-config
                - secretRef:
                    name: match-scraper-agent-secret
              volumeMounts:
                - name: agent-state
                  mountPath: /data/agent-state
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
          volumes:
            - name: agent-state
              persistentVolumeClaim:
                claimName: agent-state
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: match-scraper-agent-weekend-sun
  namespace: match-scraper
spec:
  # Sun 00:00-20:00 ET hourly, minus 02:00/08:00/14:00/20:00 which the base
  # CronJob covers. 20:00 is a base slot, so the window still ends there.
  schedule: "0 0-1,3-7,9-13,15-19 * * 0"
  timeZone: America/New_York
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: agent
              image: ghcr.io/silverbeer/match-scraper:latest
              imagePullPolicy: Always
              args: ["run", "--env", "prod"]
              env:
                - name: ASSIST_FEED_CACHE_DIR
                  value: /data/agent-state/assist-feeds
              envFrom:
                - configMapRef:
                    name: match-scraper-agent-config
                - secretRef:
                    name: match-scraper-agent-secret
              volumeMounts:
                - name: agent-state
                  mountPath: /data/agent-state
              resources:
                requests:
                  cpu: 200m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
          volumes:
            - name: agent-state
              persistentVolumeClaim:
                claimName: agent-state
