apiVersion: batch/v1
kind: CronJob
metadata:
  name: score-canary
  namespace: match-scraper
spec:
  # Mondays at 12:00 UTC, which is the morning after a weekend of fixtures.
  # The first run that can prove anything is 2026-09-07, the Monday after the
  # 2026-2027 opening weekend — until then the window holds no played fixtures
  # and the job exits 0 quietly.
  #
  # Weekly rather than one-shot on purpose: the question "did results arrive"
  # does not stop mattering after the first weekend, and a feed that silently
  # stops carrying scores in March is the same defect as one that never
  # carried them in September.
  schedule: "0 12 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: score-canary
              image: ghcr.io/silverbeer/match-scraper:latest
              imagePullPolicy: Always
              # Exit codes are outcomes, not crashes — same reasoning as the
              # release watcher. 10 is the finding this job exists to make, and
              # letting Kubernetes read it as a failed Job would retry it and
              # bury the signal in a restart loop. With several feeds probed,
              # 10 and 20 mean "at least one feed" — the table above the exit
              # names which.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  # Friday through Sunday: the weekend just gone, whatever
                  # Monday it is.
                  from=$(date -u -d 'last friday' +%Y-%m-%d 2>/dev/null || date -u -v-3d +%Y-%m-%d)
                  to=$(date -u -d 'yesterday' +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)
                  # All three competition seasons, not just the league one.
                  # Flex and Academy are separate feeds with their own keys —
                  # Flex alone is 52 of the 76 configured targets — so probing
                  # only the league feed leaves most of what we scrape
                  # unwatched by the job that exists to watch it (SB-1016).
                  uv run mls-scraper verify-scores --from "$from" --to "$to" \
                    --feed league --feed flex --feed academy
                  code=$?
                  case "$code" in
                    0)  echo "canary: scores arriving, or nothing played" ;;
                    10) echo "canary: FIXTURES PLAYED AND NONE SCORED — a feed is not delivering results" ;;
                    20) echo "canary: a competition season has no feed" ;;
                    *)  echo "canary: unexpected exit $code"; exit "$code" ;;
                  esac
              envFrom:
                - configMapRef:
                    name: match-scraper-agent-config
                - secretRef:
                    name: match-scraper-agent-secret
              resources:
                # One JSON download, no browser.
                requests:
                  cpu: 50m
                  memory: 256Mi
                limits:
                  cpu: "250m"
                  memory: 512Mi
